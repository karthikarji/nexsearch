server:
  port: 9090

spring:
  application:
    name: nexsearch

  datasource:
    url: ${NEXSEARCH_DB_URL}
    username: ${NEXSEARCH_DB_USERNAME}
    password: ${NEXSEARCH_DB_PASSWORD}

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
    default-schema: document
    schemas: migration, document
    create-schemas: true
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: document

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.nexsearch: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"